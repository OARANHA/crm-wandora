name: ELUS upstream archived conversation backfill DB verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/elus-upstream-archived-radar-backfill.yml"
      - "supabase/baseline.sql"
      - "tests/invariants/conversa-arquivada-nao-gera-pendencia.test.ts"
      - "tests/invariants/atualizacao-nao-reduplica-demanda.test.ts"
      - ".changes/elus-upstream-184-archived-radar-backfill-20261017.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Backfill static checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint database regression test
        run: pnpm exec eslint tests/invariants/conversa-arquivada-nao-gera-pendencia.test.ts
      - name: Check workflow formatting
        run: pnpm exec prettier --check .github/workflows/elus-upstream-archived-radar-backfill.yml

  postgres-invariants:
    name: Backfill R2 — PostgreSQL ${{ matrix.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        major: [15, 17]
    env:
      TEST_DB_IMAGE: pgvector/pgvector:pg${{ matrix.major }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve published upstream kit and fetch comparison tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # O fork ELUS não tem releases/tags v1.x publicadas. Comparar com o
          # upstream oficial, sem inferir "última release" por ordenação de tags.
          release="$(gh api repos/melgarafael/DeskcommCRM/releases/latest --jq .tag_name)"
          if [[ ! "$release" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "FATAL: upstream não forneceu release estável válida" >&2
            exit 1
          fi
          # O script de isolamento usa tags locais; o origin do ELUS não as tem.
          # Buscar apenas os dois scripts comparados, no runner descartável.
          for tag in "$release" v1.63.0; do
            git fetch --no-tags --depth=1 https://github.com/melgarafael/DeskcommCRM.git \\
              "+refs/tags/${tag}:refs/tags/${tag}"
            git cat-file -e "${tag}:hostgator-setup-kit/update.sh"
          done
          printf 'CONFERENCIA_KIT_RELEASE=%s\\n' "$release" >> "$GITHUB_ENV"
      - name: Apply baseline twice and run actual SQL invariants
        run: >-
          pnpm test:db
          tests/invariants/conversa-arquivada-nao-gera-pendencia.test.ts
          tests/invariants/atualizacao-nao-reduplica-demanda.test.ts
