name: ELUS AI platform default verification

on:
  pull_request:
    paths:
      - ".github/workflows/elus-ai-platform-default-verification.yml"
      - "app/admin/(protected)/tenants/**"
      - "app/api/v1/admin/tenants/**/ai-default/**"
      - "components/admin/tenants/TenantAiPlatformDefault.tsx"
      - "lib/ai/padrao-llm-da-organizacao*"
      - "app/api/v1/admin/tenants/**/ai-credentials/**"
      - "lib/ai/credenciais/guardar.ts"
      - "lib/ai/credenciais/guardar-validada-superadmin.test.ts"
      - "tests/unit/ia-credenciais-superadmin.test.ts"
      - "lib/agent-engine/edge/llm/**"
      - "lib/ai/gateway-binding.ts"
      - "lib/ai/pontos/resolver.ts"
      - "lib/ai/agents/first-publication.ts"
      - "app/app/ai/agents/new/page.tsx"
      - "app/app/ai/agents/[id]/_components/AgentForm.tsx"
      - "tests/unit/ia-credenciais-superadmin-gates.test.ts"
      - "docs/specs/elus-credenciais-plataforma-superadmin-v1.md"
      - "tests/unit/ia-padrao-central-superadmin-gates.test.ts"
      - "lib/audit/actions.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and AI platform defaults
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: >-
          pnpm exec eslint
          "app/admin/(protected)/tenants/[id]/_client.tsx"
          "app/api/v1/admin/tenants/[id]/ai-default/route.ts"
          components/admin/tenants/TenantAiPlatformDefault.tsx
          lib/ai/padrao-llm-da-organizacao.ts
          lib/ai/padrao-llm-da-organizacao.test.ts
          "app/api/v1/admin/tenants/[id]/ai-credentials/route.ts"
          "app/api/v1/admin/tenants/[id]/ai-credentials/test/route.ts"
          lib/ai/credenciais/guardar.ts
          lib/ai/credenciais/guardar-validada-superadmin.test.ts
          tests/unit/ia-credenciais-superadmin.test.ts
          lib/ai/pontos/resolver.ts
          lib/ai/gateway-binding.ts
          lib/agent-engine/edge/llm/credentials.ts
          lib/agent-engine/edge/llm/run-model-call.ts
          lib/agent-engine/edge/llm/binding-do-ponto.ts
          lib/ai/agents/first-publication.ts
          "app/app/ai/agents/new/page.tsx"
          "app/app/ai/agents/[id]/_components/AgentForm.tsx"
          tests/unit/ia-credenciais-superadmin-gates.test.ts
          tests/unit/ia-padrao-central-superadmin-gates.test.ts
      - name: Formatting
        run: >-
          pnpm exec prettier --check
          "app/admin/(protected)/tenants/[id]/_client.tsx"
          "app/api/v1/admin/tenants/[id]/ai-default/route.ts"
          components/admin/tenants/TenantAiPlatformDefault.tsx
          lib/ai/padrao-llm-da-organizacao.ts
          lib/ai/padrao-llm-da-organizacao.test.ts
          "app/api/v1/admin/tenants/[id]/ai-credentials/route.ts"
          "app/api/v1/admin/tenants/[id]/ai-credentials/test/route.ts"
          lib/ai/credenciais/guardar.ts
          lib/ai/credenciais/guardar-validada-superadmin.test.ts
          tests/unit/ia-credenciais-superadmin.test.ts
          lib/ai/pontos/resolver.ts
          lib/ai/gateway-binding.ts
          lib/agent-engine/edge/llm/credentials.ts
          lib/agent-engine/edge/llm/run-model-call.ts
          lib/agent-engine/edge/llm/binding-do-ponto.ts
          lib/ai/agents/first-publication.ts
          "app/app/ai/agents/new/page.tsx"
          "app/app/ai/agents/[id]/_components/AgentForm.tsx"
          tests/unit/ia-credenciais-superadmin-gates.test.ts
          tests/unit/ia-padrao-central-superadmin-gates.test.ts
      - name: Governed defaults and admin regression
        run: >-
          pnpm exec vitest run
          lib/ai/padrao-llm-da-organizacao.test.ts
          tests/unit/ia-padrao-central-superadmin-gates.test.ts
          tests/unit/ia-credenciais-superadmin-gates.test.ts
          tests/unit/ia-credenciais-superadmin.test.ts
          lib/ai/credenciais/guardar-validada-superadmin.test.ts
          tests/unit/pontos-de-ia-resolver.test.ts
          lib/agent-engine/edge/llm/credentials.test.ts
          tests/unit/gateway-binding.test.ts
          tests/unit/seam-respeita-o-binding.test.ts
          tests/unit/onboarding-agente-nao-publicado.test.ts
          tests/unit/agente-novo-herda-o-provedor-da-organizacao.test.ts
          tests/unit/admin-escrita-exige-scope-full.test.ts
          tests/unit/ia-plataforma-provedor-gates.test.ts
          --maxWorkers=2
