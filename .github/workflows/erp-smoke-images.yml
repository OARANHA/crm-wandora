name: ERP smoke mirror

on:
  push:
    branches:
      - ops/erp-smoke-30cf923
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror smoke images to ttl.sh
        shell: bash
        run: |
          set -euo pipefail

          docker pull ghcr.io/oaranha/crm-wandora-app:erp-smoke-30cf923
          docker tag ghcr.io/oaranha/crm-wandora-app:erp-smoke-30cf923 ttl.sh/9b2d5c4e7a3146b9a1f0e6c8d5a2f730-app:1h
          docker push ttl.sh/9b2d5c4e7a3146b9a1f0e6c8d5a2f730-app:1h

          docker pull ghcr.io/oaranha/crm-wandora-worker:erp-smoke-30cf923
          docker tag ghcr.io/oaranha/crm-wandora-worker:erp-smoke-30cf923 ttl.sh/9b2d5c4e7a3146b9a1f0e6c8d5a2f730-worker:1h
          docker push ttl.sh/9b2d5c4e7a3146b9a1f0e6c8d5a2f730-worker:1h

          docker pull ghcr.io/oaranha/crm-wandora-scheduler:erp-smoke-30cf923
          docker tag ghcr.io/oaranha/crm-wandora-scheduler:erp-smoke-30cf923 ttl.sh/9b2d5c4e7a3146b9a1f0e6c8d5a2f730-scheduler:1h
          docker push ttl.sh/9b2d5c4e7a3146b9a1f0e6c8d5a2f730-scheduler:1h
