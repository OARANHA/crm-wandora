name: Governed delivery verification

on:
  pull_request:
    paths:
      - ".github/workflows/governed-delivery-verification.yml"
      - "lib/agent-engine/agent/governed-conversation-delivery.ts"
      - "lib/agent-engine/agent/governed-conversation-delivery.test.ts"
      - "lib/agent-engine/agent/approved-reply.ts"
      - "lib/agent-engine/agent/approved-reply-governed-delivery.test.ts"
      - "lib/agent-engine/guardrails/before-send.ts"
      - "lib/agent-engine/edge/crm/send-message.ts"
      - "lib/agent-engine/edge/crm/send-ledger.ts"
      - "lib/channels/runtime.ts"
      - "lib/messaging/media/upload-validation.ts"
      - "docs/specs/governed-cross-conversation-delivery-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-delivery:
    name: Typecheck and governed delivery tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint governed delivery changes
        run: >
          pnpm exec eslint
          lib/agent-engine/agent/governed-conversation-delivery.ts
          lib/agent-engine/agent/governed-conversation-delivery.test.ts
          lib/agent-engine/agent/approved-reply.ts
          lib/agent-engine/agent/approved-reply-governed-delivery.test.ts

      - name: Check formatting
        run: >
          pnpm exec prettier --check
          ".github/workflows/governed-delivery-verification.yml"
          "lib/agent-engine/agent/governed-conversation-delivery.ts"
          "lib/agent-engine/agent/governed-conversation-delivery.test.ts"
          "lib/agent-engine/agent/approved-reply.ts"
          "lib/agent-engine/agent/approved-reply-governed-delivery.test.ts"
          "docs/specs/governed-cross-conversation-delivery-v1.md"

      - name: Governed delivery unit tests
        run: >
          pnpm vitest run
          lib/agent-engine/agent/governed-conversation-delivery.test.ts
          lib/agent-engine/agent/approved-reply-governed-delivery.test.ts
          tests/unit/before-send-chain-shape.test.ts
