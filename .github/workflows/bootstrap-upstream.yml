name: Bootstrap DeskcommCRM upstream

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message == 'Bootstrap CRM from DeskcommCRM'
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import upstream snapshot
        run: |
          git config user.name "Wandora Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/melgarafael/DeskcommCRM.git
          git fetch --depth=1 upstream main
          git rm -r --ignore-unmatch .
          git checkout FETCH_HEAD -- .
          git add -A
          git commit -m "Import DeskcommCRM upstream snapshot"
          git push origin main
