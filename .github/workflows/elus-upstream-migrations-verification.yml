name: ELUS upstream migrations preflight

on:
  pull_request:
    paths:
      - ".github/workflows/elus-upstream-migrations-verification.yml"
      - "scripts/elus-upstream-migrations-preflight.mjs"
      - "tests/shell/elus-upstream-migrations.test.mjs"

permissions:
  contents: read

jobs:
  migration-preflight:
    name: Verify read-only migration projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify JS syntax
        run: |
          node --check scripts/elus-upstream-migrations-preflight.mjs
          node --check tests/shell/elus-upstream-migrations.test.mjs

      - name: Run read-only Git fixture tests
        run: node --test tests/shell/elus-upstream-migrations.test.mjs

      - name: Scope declaration
        if: always()
        run: |
          echo "Static Git-tree and disposable Git fixture tests only."
          echo "No Supabase or VendaERP access, no SQL, image publishing or deployment."
