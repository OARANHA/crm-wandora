name: ELUS upstream Inbox channel label verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/elus-upstream-inbox-channel-label.yml"
      - "lib/channels/estado.ts"
      - "components/inbox/ConversationHeader.tsx"
      - "components/inbox/ConversationListItem.tsx"
      - "components/inbox/ConversationHeader.test.tsx"
      - "components/inbox/ConversationListItem.test.tsx"
      - "tests/unit/inbox-rotulo-do-canal-elus.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channel-label:
    name: Inbox channel label and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint touched runtime and tests
        run: >-
          pnpm exec eslint
          lib/channels/estado.ts
          components/inbox/ConversationHeader.tsx
          components/inbox/ConversationListItem.tsx
          components/inbox/ConversationHeader.test.tsx
          components/inbox/ConversationListItem.test.tsx
          tests/unit/inbox-rotulo-do-canal-elus.test.ts

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          .github/workflows/elus-upstream-inbox-channel-label.yml
          tests/unit/inbox-rotulo-do-canal-elus.test.ts

      - name: Unit tests
        run: >-
          pnpm exec vitest run
          tests/unit/inbox-rotulo-do-canal-elus.test.ts
          components/inbox/ConversationHeader.test.tsx
          components/inbox/ConversationListItem.test.tsx
          tests/unit/inbox-header-nao-trava.test.tsx
