name: Elus 360 + ERP candidate images

on:
  push:
    branches:
      - candidate/elus360-erp
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            image: ghcr.io/oaranha/crm-wandora-app
          - name: worker
            dockerfile: Dockerfile.worker
            image: ghcr.io/oaranha/crm-wandora-worker
          - name: scheduler
            dockerfile: Dockerfile.scheduler
            image: ghcr.io/oaranha/crm-wandora-scheduler

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:candidate-elus360-erp
            ${{ matrix.image }}:candidate-${{ github.sha }}
          cache-from: type=gha,scope=elus360-erp-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=elus360-erp-${{ matrix.name }}
