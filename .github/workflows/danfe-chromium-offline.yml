name: DANFE Chromium offline

on:
  pull_request:
    paths:
      - ".github/workflows/danfe-chromium-offline.yml"
      - "lib/documentos/renderizar-url-pdf.ts"
      - "lib/documentos/renderizar-url-pdf-controlado.ts"
      - "lib/integracoes-erp/autoridade-admin-whatsapp.ts"
      - "Dockerfile.worker"
      - "tests/unit/danfe-renderer-controlado.test.ts"
      - "tests/integration/danfe-playwright-worker-offline.test.ts"
      - "tests/integration/danfe-chromium-offline.test.ts"
      - "tests/unit/documentos-renderizar-url-pdf.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-offline:
    name: Chromium real com SPA local (sem VendaERP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar tipagem, lint e formatação
        run: |
          pnpm typecheck
          pnpm exec eslint \
            lib/documentos/renderizar-url-pdf.ts \
            lib/documentos/renderizar-url-pdf-controlado.ts \
            tests/unit/danfe-renderer-controlado.test.ts \
            tests/integration/danfe-playwright-worker-offline.test.ts \
            lib/integracoes-erp/danfe.ts \
            lib/integracoes-erp/autoridade-admin-whatsapp.ts \
            tests/integration/danfe-chromium-offline.test.ts \
            tests/unit/documentos-renderizar-url-pdf.test.ts \
            tests/unit/integracoes-erp-admin-whatsapp.test.ts \
            tests/unit/integracoes-erp-danfe.test.ts
          pnpm exec prettier --check \
            lib/documentos/renderizar-url-pdf.ts \
            lib/documentos/renderizar-url-pdf-controlado.ts \
            tests/unit/danfe-renderer-controlado.test.ts \
            tests/integration/danfe-playwright-worker-offline.test.ts \
            lib/integracoes-erp/danfe.ts \
            lib/integracoes-erp/autoridade-admin-whatsapp.ts \
            tests/integration/danfe-chromium-offline.test.ts \
            tests/unit/documentos-renderizar-url-pdf.test.ts \
            tests/unit/integracoes-erp-admin-whatsapp.test.ts \
            tests/unit/integracoes-erp-danfe.test.ts

      - name: Instalar Chromium no runner do CI, não na VPS
        run: pnpm exec playwright install --with-deps chromium

      - name: Selecionar binário Playwright instalado
        run: |
          set -euo pipefail
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Comparar bootstrap legado e redirect 302 em SPA sintética
        env:
          ELUS_DANFE_CHROMIUM_OFFLINE: "1"
        run: >-
          pnpm exec vitest run
          tests/integration/danfe-chromium-offline.test.ts
          tests/unit/documentos-renderizar-url-pdf.test.ts
          tests/unit/danfe-renderer-controlado.test.ts
          --maxWorkers=1

  renderer-worker-real:
    name: Chromium e Playwright reais no Alpine do worker (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir worker somente no CI
        run: docker build -f Dockerfile.worker -t elus-worker-danfe-offline .

      - name: Testar Chromium na memória e no isolamento reais do worker
        run: >-
          docker run --rm
          --network none
          --memory 512m
          --pids-limit 256
          --cap-drop ALL
          --security-opt no-new-privileges
          -e ELUS_DANFE_WORKER_OFFLINE=1
          --mount "type=bind,source=${GITHUB_WORKSPACE}/tests,target=/app/tests,readonly"
          elus-worker-danfe-offline
          pnpm exec vitest run
          tests/integration/danfe-playwright-worker-offline.test.ts
          --maxWorkers=1
