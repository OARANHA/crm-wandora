name: ELUS upstream Inbox dark selection verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/elus-upstream-inbox-dark-selection.yml"
      - "components/inbox/ConversationListItem.tsx"
      - "tests/unit/inbox-selecionada-legivel-elus.test.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dark-selection:
    name: Inbox selected item readable in dark theme
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint changed files
        run: >-
          pnpm exec eslint
          components/inbox/ConversationListItem.tsx
          tests/unit/inbox-selecionada-legivel-elus.test.tsx

      - name: Check workflow formatting
        run: >-
          pnpm exec prettier --check
          .github/workflows/elus-upstream-inbox-dark-selection.yml

      - name: Selected conversation regressions
        run: >-
          pnpm exec vitest run
          tests/unit/inbox-selecionada-legivel-elus.test.tsx
          components/inbox/ConversationListItem.test.tsx
