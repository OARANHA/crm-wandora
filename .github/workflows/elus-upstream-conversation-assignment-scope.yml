name: ELUS upstream conversation assignment scope verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/elus-upstream-conversation-assignment-scope.yml"
      - ".changes/elus-upstream-184-conversation-assignment-scope-20261018.md"
      - "app/api/v1/conversations/**/transfer/route.ts"
      - "lib/i18n/dicionario.ts"
      - "supabase/baseline.sql"
      - "supabase/migrations/20261018010000_0507_atribuicao_respeita_carteira.sql"
      - "supabase/migrations/MANIFEST.md"
      - "tests/invariants/atribuicao-respeita-carteira.test.ts"
      - "tests/unit/conversation-assignment.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation-assignment-scope:
    name: Conversation assignment visibility scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint touched TypeScript
        run: >-
          pnpm exec eslint
          app/api/v1/conversations/[id]/transfer/route.ts
          lib/i18n/dicionario.ts
          tests/invariants/atribuicao-respeita-carteira.test.ts
          tests/unit/conversation-assignment.test.ts

      - name: Check changed-file formatting
        run: >-
          pnpm exec prettier --check
          .github/workflows/elus-upstream-conversation-assignment-scope.yml
          .changes/elus-upstream-184-conversation-assignment-scope-20261018.md
          tests/invariants/atribuicao-respeita-carteira.test.ts
          tests/unit/conversation-assignment.test.ts

      - name: Unit and doctrine gates
        run: >-
          pnpm exec vitest run
          tests/unit/conversation-assignment.test.ts
          tests/unit/manifest-x-migrations.test.ts
          tests/unit/apendice-do-baseline-nao-diverge-da-cadeia.test.ts
          tests/unit/varredura-anon-e-o-ultimo-bloco.test.ts

      - name: PostgreSQL 15 invariant
        run: pnpm test:db tests/invariants/atribuicao-respeita-carteira.test.ts
