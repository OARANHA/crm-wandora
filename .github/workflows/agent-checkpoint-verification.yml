name: Agent checkpoint verification

on:
  pull_request:
    paths:
      - ".github/workflows/agent-checkpoint-verification.yml"
      - "lib/agent-engine/agent/abertura/**"
      - "lib/agent-engine/agent/inbound-turn.ts"
      - "lib/agent-engine/agent/recencia-fiscal-gate.ts"
      - "lib/agent-engine/agent/danfe-failure-guard.ts"
      - "tests/unit/erp-recencia-fail-closed.test.ts"
      - "tests/unit/isis-danfe-failure-guard.test.ts"
      - "lib/agent-engine/agent/declaracao.ts"
      - "tests/unit/checkpoint-*.test.ts"
      - "tests/unit/declaracao-do-turno.test.ts"
      - "tests/unit/recorte-1-build-opening.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    name: Typecheck and checkpoint regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint checkpoint and inbound turn
        run: >-
          pnpm exec eslint
          lib/agent-engine/agent/abertura/checkpoint.ts
          lib/agent-engine/agent/inbound-turn.ts
          lib/agent-engine/agent/recencia-fiscal-gate.ts
          lib/agent-engine/agent/danfe-failure-guard.ts
          tests/unit/erp-recencia-fail-closed.test.ts
          tests/unit/isis-danfe-failure-guard.test.ts
          tests/unit/checkpoint-recuperacao-local.test.ts

      - name: Check formatting of focused changes
        run: >-
          pnpm exec prettier --check
          lib/agent-engine/agent/abertura/checkpoint.ts
          tests/unit/checkpoint-recuperacao-local.test.ts
          lib/agent-engine/agent/recencia-fiscal-gate.ts
          lib/agent-engine/agent/danfe-failure-guard.ts
          tests/unit/erp-recencia-fail-closed.test.ts
          tests/unit/isis-danfe-failure-guard.test.ts

      - name: Checkpoint regression tests
        run: >-
          pnpm exec vitest run
          tests/unit/checkpoint-recuperacao-local.test.ts
          tests/unit/erp-recencia-fail-closed.test.ts
          tests/unit/isis-danfe-failure-guard.test.ts
          tests/unit/declaracao-do-turno.test.ts
          tests/unit/recorte-1-build-opening.test.ts
          --maxWorkers=2
