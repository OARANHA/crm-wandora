name: Publish Elus images

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.worker"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - ".github/workflows/publish-elus-images.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: elus-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: Dockerfile
            image: elus-app
          - name: worker
            file: Dockerfile.worker
            image: elus-worker

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/oaranha/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/oaranha/${{ matrix.image }}:main
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
