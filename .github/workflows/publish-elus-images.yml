name: Publish PR43 isolated canary

on:
  push:
    branches:
      - "ops/pr43-canary-6667aac"

permissions:
  contents: read
  packages: write

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact accepted PR head
        uses: actions/checkout@v4
        with:
          ref: 6667aac7f399f66920700fb80d560def5d816bb5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish exact SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/oaranha/elus-app:6667aac7f399f66920700fb80d560def5d816bb5
          build-args: APP_VERSION=6667aac7f399f66920700fb80d560def5d816bb5
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          provenance: true
