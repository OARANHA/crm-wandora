name: Publish Elus images

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.worker"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - ".github/workflows/publish-elus-images.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: elus-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: Dockerfile
            image: elus-app
          - name: worker
            file: Dockerfile.worker
            image: elus-worker

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve immutable image SHA
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ghcr.io/oaranha/${{ matrix.image }}:${{ steps.image.outputs.sha }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ghcr.io/oaranha/{0}:main', matrix.image) || '' }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
