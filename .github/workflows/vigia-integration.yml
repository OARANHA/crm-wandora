name: Vigia integration

on:
  pull_request:
    paths:
      - "app/api/v1/integrations/vigia/**"
      - "lib/vigia/**"
      - "workers/agent-worker/main.ts"
      - "tests/unit/vigia-integracao.test.ts"
      - "compose.portainer.yml"
      - ".github/workflows/vigia-integration.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Native Vigia integration tests
        run: pnpm exec vitest run tests/unit/vigia-integracao.test.ts
