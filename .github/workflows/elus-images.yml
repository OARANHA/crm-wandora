name: Elus container images

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.worker"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "workers/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "compose.portainer.yml"
      - ".github/workflows/elus-images.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.worker"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "workers/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "compose.portainer.yml"
      - ".github/workflows/elus-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: elus-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            dockerfile: Dockerfile
            image: elus-app
          - service: worker
            dockerfile: Dockerfile.worker
            image: elus-worker

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/oaranha/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/oaranha/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/OARANHA/crm-wandora
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Elus ${{ matrix.service }}
          cache-from: type=gha,scope=elus-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=elus-${{ matrix.service }}
